<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dark Background -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    
    <!-- Signature Red Glow Backlight -->
    <radialGradient id="red-glow" cx="256" cy="240" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ad1d1d" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ad1d1d" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>

    <!-- Signature Red Gradient (PDF-DS tokens: #c21f1f -> #ad1d1d -> #941a1a) -->
    <linearGradient id="red-grad" x1="116" y1="90" x2="410" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c21f1f"/>
      <stop offset="50%" stop-color="#ad1d1d"/>
      <stop offset="100%" stop-color="#941a1a"/>
    </linearGradient>

    <!-- Shadow & Glow Filters -->
    <filter id="q-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ad1d1d" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <circle cx="256" cy="240" r="220" fill="url(#red-glow)"/>
  
  <!-- Hardware Bevel Inner Border (PDF-DS aesthetic) -->
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(0, 0, 0, 0.6)" stroke-width="1"/>

  <!-- Main Q-Bubble Emblem (Bold, Simple, Iconic) -->
  <g filter="url(#q-shadow)">
    <path d="M 370 310 L 420 395 C 424 402 416 410 408 405 L 300 364 A 140 140 0 1 1 370 310 Z" fill="url(#red-grad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Clean Minimalist Lock Cutout Inside Q-Bubble -->
  <g fill="#09090b">
    <!-- Lock Body -->
    <rect x="216" y="220" width="80" height="64" rx="14"/>
    <!-- Lock Shackle -->
    <path d="M 236 220 V 192 A 20 20 0 0 1 276 192 V 220" fill="none" stroke="#09090b" stroke-width="16" stroke-linecap="round"/>
  </g>
  
  <!-- Subtle Red Dot / Keyhole Core accent inside Lock -->
  <circle cx="256" cy="246" r="8" fill="#ad1d1d"/>
  <rect x="253" y="246" width="6" height="16" rx="3" fill="#ad1d1d"/>
</svg>
