# Nginx Configuration for High-Performance Video Static Serving & Streaming
# 
# Complies with:
# 1. Nginx Static Serving Delegation: Bypasses backend applications completely for video playback.
# 2. HTTP Range Requests (206 Partial Content): Enabled by default for seamless video seeking/streaming.
# 3. Connection & Rate Limiting: Throttles concurrent connections and transfer speed to prevent HDD I/O bottlenecks.

worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # --- I/O Bottleneck Protection & Rate Limiting ---
    # Limit concurrent connections per IP address (Max 5 simultaneous downloads per IP)
    limit_conn_zone $binary_remote_addr zone=video_conn_zone:10m;
    
    # Limit request rate per IP (Max 10 requests per second to prevent DOS on HDD)
    limit_req_zone $binary_remote_addr zone=video_req_zone:10m rate=10r/s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name matrix.qpi.digital;

        # --- Video Static Serving & HTTP 206 Streaming ---
        # Directly serve video files from physical disk without passing to backend application
        location /media/videos/ {
            alias /var/www/uploads/videos/;
            
            # Enable HTTP 206 Range Requests (Partial Content)
            # Nginx supports byte-range requests natively when serving files from disk.
            add_header Accept-Ranges bytes;

            # --- HDD I/O Bottleneck Prevention ---
            # 1. Restrict concurrent video streams to 3 per IP address
            limit_conn video_conn_zone 3;
            
            # 2. Rate limit burst requests
            limit_req zone=video_req_zone burst=5 nodelay;

            # 3. I/O Bandwidth Throttling (Rate Limiting)
            # Allow initial fast buffering (first 2MB at full speed for instant playback start),
            # then throttle speed to 1.5 MB/s per connection to protect slow HDD I/O queues.
            limit_rate_after 2m;
            limit_rate 1500k;

            # Optimize disk read buffers for large video files
            output_buffers 1 512k;
            read_ahead 512k;
            
            # Cache headers for static video assets
            expires 30d;
            add_header Cache-Control "public, no-transform";
            
            # CORS headers for web player access
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
        }

        # --- Proxy Backend API Requests ---
        location /api/ {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Allow up to 45MB upload body size for video uploads
            client_max_body_size 45M;
        }

        # --- Frontend Web Application ---
        location / {
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
